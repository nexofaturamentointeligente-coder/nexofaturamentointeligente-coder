<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t d">
<title id="t">Indicador de Pressão de Estoque</title>
<desc id="d">Pressão de Estoque = Total Comprado − Faturamento. Positivo: a loja comprou mais do que vendeu e há capital preso em estoque. Negativo ou equilibrado: estoque girando e geração de liquidez. Exemplo ilustrativo: faturamento R$ 142.800, compras R$ 156.300, pressão +R$ 13.500.</desc>
<defs><clipPath id="ir"><rect width="1280" height="400" rx="24"/></clipPath><linearGradient id="ibg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#110A1C"/><stop offset="1" stop-color="#0A0711"/></linearGradient><pattern id="igrid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#A855F7" stroke-opacity="0.07"/></pattern><linearGradient id="iline" x1="0" x2="1"><stop offset="0" stop-color="#A855F7" stop-opacity="0"/><stop offset="0.35" stop-color="#A855F7"/><stop offset="0.75" stop-color="#F97316"/><stop offset="1" stop-color="#F97316" stop-opacity="0"/></linearGradient><radialGradient id="ig0"><stop offset="0" stop-color="#F97316" stop-opacity="0.1"/><stop offset="1" stop-color="#F97316" stop-opacity="0"/></radialGradient><radialGradient id="ig1"><stop offset="0" stop-color="#7C3AED" stop-opacity="0.25"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient></defs>
<style>.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both}@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<g clip-path="url(#ir)"><rect width="1280" height="400" fill="url(#ibg)"/><rect width="1280" height="400" fill="url(#igrid)"/><circle cx="300" cy="120" r="380" fill="url(#ig0)"/><circle cx="1000" cy="300" r="420" fill="url(#ig1)"/>
