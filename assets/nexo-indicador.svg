<text x="44" y="104" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#F3F1F8">Pressão de Estoque</text>
<rect x="44" y="128" width="470" height="64" rx="14" fill="#1A1526" stroke="#A855F7" stroke-opacity="0.35"/>
