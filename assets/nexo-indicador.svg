<circle cx="51" cy="227" r="6" fill="#F97316"/>
<text x="68" y="232" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#F97316">Positivo</text>
<text font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="15" fill="#A9A6BA"><tspan x="68" y="256">A loja comprou mais do que vendeu: estoque</tspan><tspan x="68" y="277">acumulando e capital de giro preso na prateleira.</tspan></text>
<circle cx="51" cy="311" r="6" fill="#22C55E"/>
<text x="68" y="316" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#22C55E">Negativo ou equilibrado</text>
<text font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="15" fill="#A9A6BA"><tspan x="68" y="340">Estoque girando, queima eficiente de</tspan><tspan x="68" y="361">mercadoria e geração de liquidez.</tspan></text>
