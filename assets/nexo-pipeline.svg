<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 330" width="1280" height="330" role="img" aria-labelledby="t d">
<title id="t">Como o NEXO funciona</title>
<desc id="d">Fluxo do NEXO em 5 etapas: 01 Relatórios do PDV: Vendas e compras em .csv ou .xlsx, direto do sistema de caixa.; 02 Motor de ETL: Pandas + NumPy: leitura adaptativa, limpeza e mapeamento De-Para.; 03 Indicadores: Pressão de Estoque, Curva ABC (Pareto) e semáforos 5W2H.; 04 Parecer estratégico: IA (Claude) com fallback local + revisão da equipe NEXO.; 05 Portal + PDF: Dashboards Plotly, alertas em tempo real e PDF executivo.</desc>
